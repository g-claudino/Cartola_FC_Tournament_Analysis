name: Atualizar segunda fase

on:
  schedule:
    # Acorda a cada 15 min; o passo "decidir" só segue se houver jogo (do início
    # até 4 h depois) ou se já passaram 3 h desde a última atualização.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: segunda-fase
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Decidir se atualiza agora
        id: decidir
        run: python segunda_fase.py decidir

      - name: Buscar pontuações e gerar a página
        if: steps.decidir.outputs.rodar == 'true' || github.event_name == 'workflow_dispatch'
        run: python segunda_fase.py atualizar

      - name: Salvar mudanças
        if: always() && (steps.decidir.outputs.rodar == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -A .
          # Só commita quando os dados mudam (o horário na página muda sempre).
          if git diff --cached --quiet -- 'docs/*.json' 'segunda_fase/*.json'; then
            echo "Nada novo."
          else
            git commit -m "Segunda fase: atualiza classificação, sugestões e palpites"
            git push
          fi
