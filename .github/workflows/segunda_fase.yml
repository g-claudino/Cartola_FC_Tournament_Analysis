name: Atualizar segunda fase

on:
  schedule:
    # O GitHub costuma atrasar ou pular execuções agendadas (na prática roda a cada
    # 3-5 h). Por isso o modo vigia: em horário de jogo a execução fica ativa e
    # atualiza a cada 15 min; se o próximo jogo começa nas próximas horas, espera
    # por ele. Fora de jogos, atualiza a cada 3 h.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write     # para iniciar a próxima execução quando bater o limite de 6 h

concurrency:
  group: segunda-fase
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Configurar git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"

      - name: Vigiar e atualizar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python segunda_fase.py vigiar ${{ github.event_name == 'workflow_dispatch' && '--forcar' || '' }}
